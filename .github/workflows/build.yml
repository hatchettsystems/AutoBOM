name: Auto BOM builds
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --test step_files
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: autobom-${{ runner.os }}
          path: |
            target/release/autobom
            target/release/autobom.exe
            target/release/autobom-cli
            target/release/autobom-cli.exe
